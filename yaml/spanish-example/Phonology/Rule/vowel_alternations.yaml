kind: Rule
data:
- description: /e/ becomes [ie] and /o/ becomes [ue] in stressed syllables for certain
    verbs
  kind: string_map
  id: diphthongization
  right_context: <CodaWF>
  string_map:
    - input_pattern: e
      output_pattern: ie
    - input_pattern: o
      output_pattern: ue
- description: /e/ becomes [i] in stressed syllables
  input_pattern: e
  kind: simple
  id: stressed_e_to_i
  output_pattern: i
  right_context: <CodaWF>
- description: '"zc" is written "c" before e, i'
  input_pattern: "zc"
  kind: simple
  id: zc_c_alternation
  output_pattern: c
  right_context: e|i
id: vowel_alternations
