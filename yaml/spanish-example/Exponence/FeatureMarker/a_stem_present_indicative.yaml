# This is a FeatureMarkers config file
# Define morphological formatives for a single linguistic feature.
kind: FeatureMarker
# Name of the feature, e.g., person , tense, gender
feature: person_number
id: a_stem_present_indicative

data:

  # type mk-item to add a new feature marker!
- feature_value: 1sg
  markers:
  - kind: suffix
    form: -o
  - kind: principal_part
    principal_part_value: first_singular
    # type mk-add to add a new marker for the current feature value!
- feature_value: 2sg
  markers:
  - kind: suffix
    form: -as
- feature_value: 3sg
  markers:
  - kind: suffix
    form: -a
- feature_value: 1pl
  markers:
  - kind: suffix
    form: -amos
- feature_value: 2pl
  markers:
  - kind: suffix
    form: -áis
- feature_value: 3pl
  markers:
  - kind: suffix
    form: -an

### HELP FOR MARKERS ###
# Here we define morphological formatives for each feature value.
# Map each feature value to a marker, list of markers, or null (zero-marking)
# Possible marker kinds: prefix, suffix, infix, replace, suppletion, rule, principal_part
#
# Examples:
# 1sg:
# - kind: suffix
#   form: -ep
#   stage: outer suffix
# 2sg:
# - kind: suffix
#   form: -e
#   stage: outer suffix
# 3sg: null # Zero-marked
# 1pl:
# - kind: prefix
#   form: ma-
#   stage: outer prefix
# - kind: suffix
#   form: -ep
#   stage: outer suffix
# 2pl:
# - kind: replace
#   form: [e, i]  # Replaces 'e' with 'i' (regardless of context)
# 3pl:
# - kind: rule
#   form: $palatalization # Rule reference (must start with $)


# Optional: default order stage for markers in this file
# global_stage: suffixation

# Optional: markers/rules applied to all forms in this paradigm
# global_markers:
#   - kind: prefix
#     form: ge-a_stem_present_indicative
